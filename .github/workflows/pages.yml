name: Publikacja podglądu DBTV

on:
  push:
    branches: [main, master, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pobierz bazę odcinków z Wikipedii
        run: node scripts/import-episodes.mjs
      - name: Przygotuj pliki strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
